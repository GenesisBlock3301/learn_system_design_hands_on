<desc style="fill:rgb(0, 0, 0);stroke:none;color:rgb(255, 255, 255);stroke-width:1px;stroke-linecap:butt;stroke-linejoin:miter;opacity:1;font-family:&quot;Anthropic Sans&quot;, -apple-system, &quot;system-ui&quot;, &quot;Segoe UI&quot;, sans-serif;font-size:16px;font-weight:400;text-anchor:start;dominant-baseline:auto">Two parallel lanes. The Docker lane: Dockerfile, then docker-compose.yml holding services and volumes, then docker compose up. The Kubernetes lane: the same Dockerfile, build and push the image, write manifests that equal the compose file split into objects, then kubectl apply. Dashed links connect the equivalent steps.</desc>
